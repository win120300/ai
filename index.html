<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Copilot Studio — Web Chat</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg1:#071026; --bg2:#081024; --card:#071028;
      --accent:#7c3aed; --muted:#9fb0c8; --glass: rgba(255,255,255,0.03);
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial;color:#e8f0ff;background:linear-gradient(135deg,var(--bg1),var(--bg2));-webkit-font-smoothing:antialiased}
    .container{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px}
    .card{width:100%;max-width:1100px;border-radius:14px;overflow:hidden;border:1px solid rgba(255,255,255,0.04);box-shadow:0 10px 30px rgba(2,6,23,0.6);background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01))}
    .header{display:flex;gap:14px;align-items:center;padding:18px 20px;border-bottom:1px solid rgba(255,255,255,0.03)}
    .logo{width:46px;height:46px;border-radius:10px;background:linear-gradient(135deg,var(--accent),#4f46e5);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:16px;box-shadow:0 6px 18px rgba(124,58,237,0.18)}
    .title{font-weight:600;font-size:16px}
    .subtitle{font-size:13px;color:var(--muted);margin-top:2px}
    .frame-wrap{position:relative;height:72vh;min-height:420px;background:var(--card)}
    iframe{width:100%;height:100%;border:0;display:block;background:#000}
    .controls{display:flex;align-items:center;gap:10px;padding:12px 20px;border-top:1px solid rgba(255,255,255,0.03);background:linear-gradient(180deg, rgba(255,255,255,0.01), transparent)}
    .btn{background:transparent;color:var(--muted);padding:8px 12px;border-radius:10px;border:1px solid rgba(255,255,255,0.03);cursor:pointer;font-size:13px}
    .footer{padding:12px 20px;text-align:right;font-size:13px;color:var(--muted)}
    .link{color:var(--accent);text-decoration:none}
    .spinner{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg, rgba(2,6,23,0.28), rgba(2,6,23,0.4));backdrop-filter: blur(6px);transition:opacity .25s ease,visibility .25s;z-index:10}
    .spinner.hide{opacity:0;visibility:hidden;pointer-events:none}
    .loader{width:52px;height:52px;border-radius:50%;border:6px solid rgba(255,255,255,0.06);border-top-color:var(--accent);animation:spin 1s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    @media (max-width:700px){.frame-wrap{height:60vh;min-height:320px}.title{font-size:14px}}
  </style>
</head>
<body>
  <div class="container">
    <div class="card" role="region" aria-label="Copilot Studio Chat Embed">
      <header class="header">
        <div class="logo" aria-hidden="true">AI</div>
        <div>
          <div class="title">Copilot Studio —*
